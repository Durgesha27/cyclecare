{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Welcome back</h1>
  {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" value="{{ form.get('email','') }}"></div>
    <div class="field"><label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>
  <p class="center">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
</section>
{% endblock %}
